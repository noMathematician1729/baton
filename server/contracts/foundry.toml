[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/=../../node_modules/@openzeppelin/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
